# VOX endpointing and barge-in tuning (VOX-012).
#
# These values were provisional magic numbers in src/config.py. They now live here so
# a value change is a one-line edit and its effect can be measured without touching code.
#
# Tune on evals/dev/ only. The held-out set stays sealed until gate_phase1b.py runs.
# After changing a value, run:
#   .venv/bin/python scripts/tune_vad.py
# to see the measured effect on the 45 dev utterances.

endpointing:
  # silero speech probability above which a frame counts as speech (0.0–1.0).
  # Lower -> more sensitive, more false starts. Higher -> misses soft speech.
  speech_threshold: 0.5

  # Utterances shorter than this are treated as noise (coughs, clicks), not turns.
  min_speech_ms: 250

  # Hard stop: a mic left open cannot hang the loop past this.
  max_utterance_ms: 15000

  # How long silence must last after the last speech frame before the turn is endpointed.
  # Measured on hello_testing_voice.mp3 — 1100 ms is the smallest value that clears a
  # natural mid-sentence pause. Costs ~400 ms of trailing silence per turn (lands in
  # time_to_first_audio). Tune this value and rerun scripts/tune_vad.py to see the trade-off.
  silence_ms: 1100

barge_in:
  # How much continuous speech must accumulate before the reply is stopped.
  # Too low -> a cough cuts every reply. Too high -> stop latency climbs.
  min_speech_ms: 200

  # Speech probability threshold for the barge-in listener.
  # Higher than endpointing.speech_threshold: no acoustic echo cancellation means
  # silero hears Kokoro on open speakers. A stricter threshold reduces self-interrupts;
  # it does not fix speaker bleed. Run on headphones for reliable barge-in.
  speech_threshold: 0.7

# --- self-echo guard (VOX-035) ----------------------------------------------------------------
# For a machine running on open speakers, where silero hears Kokoro and the reply becomes the next
# turn's input. Off by default and deliberately so: on headphones there is no echo to reject, and a
# guard that *can* discard a real utterance does not belong in the demo path unasked. Every number
# on the board was measured with this off.
#
#   VOX_ECHO_GUARD=1 make demo
echo_guard:
  enabled: false

  # Pearson correlation between the mic's amplitude envelope and the reply's, at the best lag,
  # above which the capture is treated as VOX hearing itself.
  #
  # 0.75 is where scripts/measure_echo_guard.py puts it on a synthetic room: over 700 ms of audio
  # it keeps 95% of echo and loses 0% of real speech, and at 1.2 s the margin is 0.82 against 0.53.
  # That is the mechanism working — it is not a value for your machine. A real speaker/mic pair is
  # nonlinear and a real room has a tail the synthetic one does not, so tune it against a recording
  # of the problem (the script's docstring says how) rather than against this comment.
  corr_threshold: 0.75

  # How far the echo may lag the reply: the output device buffer (0.182 s on the demo machine's
  # MME device) plus the flight time across a room. The correlation searches out to here.
  max_delay_ms: 500

  # Second layer, after STT: fraction of the transcript's words that must also appear in the reply
  # just spoken for the turn to be dropped as an echo that got past the envelope test.
  text_overlap: 0.70
