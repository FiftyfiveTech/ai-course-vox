[project]
name = "ai-course-track"
version = "0.1.0"
description = "<TRACK> — FiftyFive AI engineering course"
# 3.12, not 3.14: torch has no 3.14 wheels, and both silero-vad and kokoro need it.
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",   # mic capture + speaker playback (PortAudio)
    "soundfile>=0.12",      # WAV encode for the Groq upload
    "torch>=2.2",           # silero-vad and kokoro both run on it
    # Resampling a recording to the 16 kHz silero and whisper expect. Only the offline harness
    # needs it, but it arrives with torch anyway and an undeclared transitive dep is a trap.
    "torchaudio>=2.2",
    "silero-vad>=5.1",      # snakers4/silero-vad — endpointing
    "kokoro>=0.9",          # hexgrad/Kokoro-82M — local TTS
    # kokoro's phonemizer pip-installs this at first call if it is missing, which would make
    # `make demo` depend on the network at run time. Pinned so a clean clone is reproducible.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "httpx>=0.27",          # Groq + NVIDIA NIM HTTP calls
    "python-dotenv>=1.0",
    # VOX-006 arms. transformers already arrives with kokoro, so openai/whisper-base and
    # microsoft/speecht5_tts need no new modelling dep; these three are what the arms add.
    "faster-whisper>=1.0",  # Systran/faster-whisper-base — the CTranslate2 runtime
    "sentencepiece>=0.2",   # SpeechT5Tokenizer refuses to load without it
    # rhasspy/piper-voices — the fast leg of VOX-013's TTS contrast, and the only TTS arm here
    # that is actually faster than Kokoro (speecht5 is slower). Brings onnxruntime with it; the
    # voice weights themselves come from the HF repo id at run time, not from this package.
    "piper-tts>=1.7",
    # Arrives with transformers, but src/tts.py imports it directly to pull the SpeechT5 speaker
    # embedding out of a dataset repo's zip, and an undeclared transitive dep is a trap.
    "huggingface-hub>=0.23",
    "pypdf>=6.16.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# en-core-web-sm is only distributed as a release URL, not on PyPI.
[tool.hatch.metadata]
allow-direct-references = true
